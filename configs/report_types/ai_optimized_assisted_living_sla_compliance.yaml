report_type_id: ai_optimized_assisted_living_sla_compliance
version: 1.0.0
title: AI Optimized Assisted Living SLA and Compliance Report
required_columns:
- timestamp
- device_name
- property
metrics_profile: ai_optimized_assisted_living_sla_compliance
default_prefs:
  sla_response_threshold: 10
  sla_resolution_threshold: 30
  caregiver_hourly_rate: 25
  tone: technical
  audience: leadership
  focus: anomalies
prompt_instructions: Analyze event logs to determine incident compliance with service
  level agreements (SLA). Specifically, determine response and resolution times, flag
  incomplete events, and provide staffing optimization recommendations based on trend
  analysis.
output_schema:
  type: object
  additionalProperties: false
  required:
  - report_type_id
  - report_title
  - summary
  - sections
  - alerts
  - recommendations
  - tables
  - charts
  - metadata
  properties:
    report_type_id:
      type: string
    report_title:
      type: string
    summary:
      type: string
    sections:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - title
        - body
        properties:
          title:
            type: string
          body:
            type: string
    alerts:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - severity
        - message
        properties:
          severity:
            type: string
          message:
            type: string
    recommendations:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - priority
        - action
        properties:
          priority:
            type: string
          action:
            type: string
    tables:
      type: array
      items:
        type: object
        additionalProperties: true
    charts:
      type: array
      items:
        type: object
        additionalProperties: true
    metadata:
      type: object
      additionalProperties: true
