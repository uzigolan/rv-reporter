metrics_profile: telecom_session_sla_report
default_prefs:
  sla_thresholds:
    latency:
      good: 10
      critical: 50
    jitter:
      good: 5
      critical: 30
    packet_loss:
      good: 1
      critical: 5
    trend_window: hourly
  analysis_scope: aggregate
  tone: technical
  audience: engineering
  focus: anomalies
prompt_instructions: 'Please review the key SLA/performance thresholds: e.g., latency
  < 10ms is good, > 50ms is critical. Decide whether the analysis should be per-session
  or aggregate across all sessions. Define what constitutes ''degraded'' vs ''critical''
  states, and indicate if you are tracking absolute metrics or trends. Determine the
  relevance of specific bearer types and time windows for the analysis.'
output_schema:
  type: object
  additionalProperties: false
  required:
  - report_type_id
  - report_title
  - summary
  - sections
  - alerts
  - recommendations
  - tables
  - charts
  - metadata
  properties:
    report_type_id:
      type: string
    report_title:
      type: string
    summary:
      type: string
    sections:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - title
        - body
        properties:
          title:
            type: string
          body:
            type: string
    alerts:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - severity
        - message
        properties:
          severity:
            type: string
          message:
            type: string
    recommendations:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - priority
        - action
        properties:
          priority:
            type: string
          action:
            type: string
    tables:
      type: array
      items:
        type: object
        additionalProperties: true
    charts:
      type: array
      items:
        type: object
        additionalProperties: true
    metadata:
      type: object
      additionalProperties: true
