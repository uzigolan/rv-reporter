metrics_profile: telecom_session_sla_compliance
default_prefs:
  sla_rssi_threshold: -110
  sla_snr_threshold: 5
  sla_latency_good: 10
  sla_latency_critical: 50
  time_window: hourly
  tone: technical
  audience: engineering
  focus: anomalies
prompt_instructions: To generate this report, upload a CSV containing session data
  for your telecom network. Ensure the data includes the columns specified under required_columns.
  The report will evaluate the data against predefined SLA thresholds. Configure the
  parameters such as SLA thresholds for RSSI, SNR, and latency via the default preferences
  or customize them. The analysis can be set for different time windows, such as hourly
  or daily trends.
output_schema:
  type: object
  additionalProperties: false
  required:
  - report_type_id
  - report_title
  - summary
  - sections
  - alerts
  - recommendations
  - tables
  - charts
  - metadata
  properties:
    report_type_id:
      type: string
    report_title:
      type: string
    summary:
      type: string
    sections:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - title
        - body
        properties:
          title:
            type: string
          body:
            type: string
    alerts:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - severity
        - message
        properties:
          severity:
            type: string
          message:
            type: string
    recommendations:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - priority
        - action
        properties:
          priority:
            type: string
          action:
            type: string
    tables:
      type: array
      items:
        type: object
        additionalProperties: true
    charts:
      type: array
      items:
        type: object
        additionalProperties: true
    metadata:
      type: object
      additionalProperties: true
