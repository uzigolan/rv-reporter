metrics_profile: telecom_session_health_thresold_sla
default_prefs:
  sla_thresholds:
    jitter: 30
    latency: 50
    packet_loss: 5
  analysis_scope: session
  state_definition:
    degraded: jitter > SLA or latency > SLA or packet_loss > SLA / 2
    critical: packet_loss > SLA
  tone: technical
  audience: engineering
  focus: anomalies
prompt_instructions: Please upload a CSV file containing telecom session data. Ensure
  the file includes all necessary columns as per the specified schema. Adjust SLA
  thresholds via preferences if necessary. The report will focus on per-session analysis
  using SLA compliance metrics.
output_schema:
  type: object
  additionalProperties: false
  required:
  - report_type_id
  - report_title
  - summary
  - sections
  - alerts
  - recommendations
  - tables
  - charts
  - metadata
  properties:
    report_type_id:
      type: string
    report_title:
      type: string
    summary:
      type: string
    sections:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - title
        - body
        properties:
          title:
            type: string
          body:
            type: string
    alerts:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - severity
        - message
        properties:
          severity:
            type: string
          message:
            type: string
    recommendations:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - priority
        - action
        properties:
          priority:
            type: string
          action:
            type: string
    tables:
      type: array
      items:
        type: object
        additionalProperties: true
    charts:
      type: array
      items:
        type: object
        additionalProperties: true
    metadata:
      type: object
      additionalProperties: true
