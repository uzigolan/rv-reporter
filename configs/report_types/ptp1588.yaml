report_type_id: ptp1588
version: "1.0.0"
title: "IEEE 1588 PTP G.8275.1 Analysis"
required_columns:
  - frame_time_epoch
  - frame_protocols
  - ptp_message_type
  - ptp_sequence_id
  - ptp_correction_ns
  - ptp_origin_ts_seconds
  - ptp_origin_ts_nanoseconds
metrics_profile: ptp1588
default_prefs:
  tone: technical
  audience: engineering
  focus: anomalies
  time_bucket: 1min
  t4_t3_outlier_ns: 60000
  outlier_cluster_gap_s: 1.0
  correction_anomaly_ns: 1000000
  max_outlier_samples: 12
  top_n_talkers: 12
  top_n_conversations: 12
  large_packet_avg_threshold: 1200
prompt_instructions: |
  Analyze IEEE 1588 PTP traffic with emphasis on G.8275.1 behavior.
  Use local-computed metrics as the source of truth.
  Focus on:
  - Delay_Req/Delay_Resp pairing quality and T4 (t4-t3) distribution
  - spike windows and likely operational impact
  - sequence continuity for Sync/Delay_Req/Delay_Resp/Announce
  - correction-field anomaly behavior in Delay_Resp
  - whether observed drops are loss-driven, latency-jitter-driven, or metadata-anomaly-driven
  Requirements:
  - Distinguish observed facts from inferred causes.
  - Provide actionable mitigations with priority.
  - Do not print raw packet/source lines or large verbatim extracts from parsed records.
  - Keep evidence concise and aggregate-first (counts, percentiles, windows, thresholds).
output_schema:
  type: object
  additionalProperties: false
  required:
    - report_type_id
    - report_title
    - summary
    - sections
    - alerts
    - recommendations
    - tables
    - charts
    - metadata
  properties:
    report_type_id:
      type: string
    report_title:
      type: string
    summary:
      type: string
    sections:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [title, body]
        properties:
          title: { type: string }
          body: { type: string }
    alerts:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [severity, message]
        properties:
          severity: { type: string }
          message: { type: string }
    recommendations:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [priority, action]
        properties:
          priority: { type: string }
          action: { type: string }
    tables:
      type: array
      items:
        type: object
        additionalProperties: true
    charts:
      type: array
      items:
        type: object
        additionalProperties: true
    metadata:
      type: object
      additionalProperties: true
