report_type_id: twamp_telecom_session_health
version: 1.0.0
title: TWAMP Telecom Session Health Report
required_columns:
- twampControllerId
- twampPeerAddrType
- twampPeerAddr
- twampContSessionId
- twampReportCurrentStartDateAndTime
- twampReportCurrentElapsedTime
- twampReportCurrentTxPackets
- twampReportCurrentRxValidPackets
- twampReportCurrentLossPackets
- twampReportCurrentAvailableSeconds
- twampReportCurrentDelayMin
- twampReportCurrentDelayMax
- twampReportCurrentDelaySum
- twampReportCurrentDelayAverage
- twampReportCurrentDelayedPackets
- twampReportCurrentPdvMax
- twampReportCurrentIpdvMax
- twampReportCurrentIpdvSum
- twampReportCurrentIpdvValidResults
- twampReportCurrentIpdvFwdMax
- twampReportCurrentIpdvFwdSum
- twampReportCurrentIpdvFwdValidResults
- twampReportCurrentIpdvBckMax
- twampReportCurrentIpdvBckSum
- twampReportCurrentIpdvBckValidResults
- twampReportCurrentReorderedFwd
- twampReportCurrentReorderedBck
- twampReportCurrentDuplicateFwd
- twampReportCurrentDuplicateBck
- twampReportCurrentFragmentedFwd
- twampReportCurrentFragmentedBck
- twampReportCurrentDelayFwdMin
- twampReportCurrentDelayFwdMax
- twampReportCurrentDelayFwdSum
- twampReportCurrentDelayBckMin
- twampReportCurrentDelayBckMax
- twampReportCurrentDelayBckSum
- twampReportCurrentDelayedPacketsFwd
- twampReportCurrentDelayedPacketsBck
- twampReportCurrentPdvMaxFwd
- twampReportCurrentPdvMaxBck
- twampReportCurrentTxPacketsFwd
- twampReportCurrentTxPacketsBck
- twampReportCurrentRxValidPacketsFwd
- twampReportCurrentRxValidPacketsBck
- twampReportCurrentLossPacketsFwd
- twampReportCurrentLossPacketsBck
- twampReportCurrentAvailableSecondsFwd
- twampReportCurrentAvailableSecondsBck
- twampReportCurrentRxSyncValidPacketsFwd
- twampReportCurrentRxSyncValidPacketsBck
- twampReportCurrentSyncSeconds
- twampReportCurrentReordered
- twampReportCurrentDuplicate
metrics_profile: twamp_telecom_session_health
default_prefs:
  sla_thresholds:
    latency_critical: 50
    latency_degraded: 30
    packet_loss_critical: 5
    packet_loss_degraded: 1
  aggregation_level: per-session
  time_window: per-hour
  tone: technical
  audience: engineering
  focus: anomalies
prompt_instructions: Evaluate session health based on SLA thresholds for latency and
  packet loss. Prefer per-session analysis. Consider critical vs degraded states for
  latency > 50ms being critical and > 30ms being degraded. Ensure packet loss > 5%
  is critical, > 1% is degraded. Focus on hourly trends.
output_schema:
  type: object
  additionalProperties: false
  required:
  - report_type_id
  - report_title
  - summary
  - sections
  - alerts
  - recommendations
  - tables
  - charts
  - metadata
  properties:
    report_type_id:
      type: string
    report_title:
      type: string
    summary:
      type: string
    sections:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - title
        - body
        properties:
          title:
            type: string
          body:
            type: string
    alerts:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - severity
        - message
        properties:
          severity:
            type: string
          message:
            type: string
    recommendations:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - priority
        - action
        properties:
          priority:
            type: string
          action:
            type: string
    tables:
      type: array
      items:
        type: object
        additionalProperties: true
    charts:
      type: array
      items:
        type: object
        additionalProperties: true
    metadata:
      type: object
      additionalProperties: true
