report_type_id: telecom_session_health_sla_eval_v2
version: 1.0.0
title: Telecom Session Health SLA Evaluation v2
required_columns:
- twampControllerId
- twampPeerAddrType
- twampPeerAddr
- twampContSessionId
- twampReportCurrentStartDateAndTime
- twampReportCurrentElapsedTime
- twampReportCurrentTxPackets
- twampReportCurrentRxValidPackets
- twampReportCurrentLossPackets
- twampReportCurrentAvailableSeconds
- twampReportCurrentDelayMin
- twampReportCurrentDelayMax
- twampReportCurrentDelayAverage
- twampReportCurrentPdvMax
- twampReportCurrentIpdvMax
- twampReportCurrentIpdvValidResults
metrics_profile: telecom_session_health_sla_eval_v2
default_prefs:
  sla_latency_good: latency < 10ms
  sla_latency_critical: latency > 50ms
  sla_packet_loss: loss < 1%
  sla_jitter: jitter < 5ms
  analysis_scope: per-flow
  performance_states:
    degraded: latency > 20ms and <= 50ms
    critical: latency > 50ms
  time_window: per-hour
  tone: technical
  audience: engineering
  focus: anomalies
prompt_instructions: 'Evaluate the telecom session data to determine compliance with
  SLA metrics. Use the thresholds provided: latency < 10ms is good, > 50ms is critical;
  packet loss < 1%; jitter < 5ms. Focus on per-flow analysis to identify performance
  issues in latency, jitter, and packet loss. Highlight sessions meeting degraded
  or critical performance states over hourly time windows. Ensure mean latency, jitter
  (PDV), and packet loss percentages are included in the output.'
output_schema:
  type: object
  additionalProperties: false
  required:
  - report_type_id
  - report_title
  - summary
  - sections
  - alerts
  - recommendations
  - tables
  - charts
  - metadata
  properties:
    report_type_id:
      type: string
    report_title:
      type: string
    summary:
      type: string
    sections:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - title
        - body
        properties:
          title:
            type: string
          body:
            type: string
    alerts:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - severity
        - message
        properties:
          severity:
            type: string
          message:
            type: string
    recommendations:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - priority
        - action
        properties:
          priority:
            type: string
          action:
            type: string
    tables:
      type: array
      items:
        type: object
        additionalProperties: true
    charts:
      type: array
      items:
        type: object
        additionalProperties: true
    metadata:
      type: object
      additionalProperties: true
