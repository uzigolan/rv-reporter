report_type_id: telecom_session_health_sla_eval
version: 1.0.0
title: Telecom Session Health SLA Evaluation
required_columns:
- twampControllerId
- twampPeerAddrType
- twampPeerAddr
- twampContSessionId
- twampReportCurrentStartDateAndTime
- twampReportCurrentElapsedTime
- twampReportCurrentTxPackets
- twampReportCurrentRxValidPackets
- twampReportCurrentLossPackets
- twampReportCurrentAvailableSeconds
- twampReportCurrentDelayMin
- twampReportCurrentDelayMax
- twampReportCurrentDelaySum
- twampReportCurrentDelayAverage
- twampReportCurrentDelayedPackets
- twampReportCurrentPdvMax
- twampReportCurrentIpdvMax
- twampReportCurrentIpdvSum
- twampReportCurrentIpdvValidResults
- twampReportCurrentIpdvFwdMax
- twampReportCurrentIpdvFwdSum
- twampReportCurrentIpdvFwdValidResults
- twampReportCurrentIpdvBckMax
- twampReportCurrentIpdvBckSum
- twampReportCurrentIpdvBckValidResults
- twampReportCurrentReorderedFwd
- twampReportCurrentReorderedBck
- twampReportCurrentDuplicateFwd
- twampReportCurrentDuplicateBck
- twampReportCurrentFragmentedFwd
- twampReportCurrentFragmentedBck
- twampReportCurrentDelayFwdMin
- twampReportCurrentDelayFwdMax
- twampReportCurrentDelayFwdSum
- twampReportCurrentDelayBckMin
- twampReportCurrentDelayBckMax
- twampReportCurrentDelayBckSum
- twampReportCurrentDelayedPacketsFwd
- twampReportCurrentDelayedPacketsBck
- twampReportCurrentPdvMaxFwd
- twampReportCurrentPdvMaxBck
- twampReportCurrentTxPacketsFwd
- twampReportCurrentTxPacketsBck
- twampReportCurrentRxValidPacketsFwd
- twampReportCurrentRxValidPacketsBck
- twampReportCurrentLossPacketsFwd
- twampReportCurrentLossPacketsBck
- twampReportCurrentAvailableSecondsFwd
- twampReportCurrentAvailableSecondsBck
- twampReportCurrentRxSyncValidPacketsFwd
- twampReportCurrentRxSyncValidPacketsBck
- twampReportCurrentSyncSeconds
- twampReportCurrentReordered
- twampReportCurrentDuplicate
metrics_profile: telecom_session_health_sla_eval
default_prefs:
  sla_thresholds:
    delay_max: 50
    jitter_max: 30
    loss_percent_max: 1
  aggregation: session
  state_definitions:
    degraded:
      delay_max: 30
      jitter_max: 20
      loss_percent_max: 0.5
    critical:
      delay_max: 50
      jitter_max: 30
      loss_percent_max: 1
  tone: technical
  audience: engineering
  focus: anomalies
prompt_instructions: This report evaluates telecom session health metrics against
  predefined SLA thresholds. It is designed to monitor metrics like delay, jitter,
  and packet loss. You can configure the SLA thresholds for different metrics like
  maximum delay in milliseconds, jitter in milliseconds, and packet loss percentage.
  Additionally, define what constitutes a 'degraded' vs 'critical' state per session
  for comprehensive monitoring. For precise analysis, consider using session-based
  aggregation. The evaluation can include daily trends to identify patterns. Adjust
  the thresholds based on your specific network requirements for optimal monitoring.
output_schema:
  type: object
  additionalProperties: false
  required:
  - report_type_id
  - report_title
  - summary
  - sections
  - alerts
  - recommendations
  - tables
  - charts
  - metadata
  properties:
    report_type_id:
      type: string
    report_title:
      type: string
    summary:
      type: string
    sections:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - title
        - body
        properties:
          title:
            type: string
          body:
            type: string
    alerts:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - severity
        - message
        properties:
          severity:
            type: string
          message:
            type: string
    recommendations:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
        - priority
        - action
        properties:
          priority:
            type: string
          action:
            type: string
    tables:
      type: array
      items:
        type: object
        additionalProperties: true
    charts:
      type: array
      items:
        type: object
        additionalProperties: true
    metadata:
      type: object
      additionalProperties: true
