metrics_profile: telecom_session_health_sla_v2
default_prefs:
  sla_thresholds:
    latency_good_ms: 10
    latency_critical_ms: 50
    jitter_good_ms: 5
    jitter_critical_ms: 20
    loss_good_pct: 1
    loss_critical_pct: 5
  time_window: per_hour
  tone: technical
  audience: engineering
  focus: anomalies
prompt_instructions: Evaluate session health indicators such as latency, jitter, and
  packet loss against SLA thresholds. Focus analysis on per-session metrics with per-hour
  insights. Identify sessions in 'degraded' state (exceeding good thresholds) or 'critical'
  state (exceeding critical thresholds).
output_schema:
  type: object
  additionalProperties: false
