description: Detect time synchronization and basic SNMP performance anomalies from
  SNMP polling/export CSVs that include local/UTC timestamps and system uptime. Identifies
  missing polling intervals, clock drift between local and UTC timestamps, uptime
  resets (device reboots), duplicate timestamps, and basic uptime statistics per device.
